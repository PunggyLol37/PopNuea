<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pop NUEA</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #f7ede2;
      font-family: Arial, sans-serif;
      touch-action: manipulation;
    }
    /* สไตล์ของชื่อเกม Pop NUEA */
    #title {
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: #2b2d42;
      margin: 0 0 10px 0;
      text-transform: uppercase;
    }
    #score {
      font-size: 3.5rem;
      font-weight: bold;
      color: #333;
      margin-bottom: 25px;
    }
    #cat-container {
      width: 320px;
      height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    #cat-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <!-- ส่วนหัวข้อชื่อเกม -->
  <h1 id="title">Pop NUEA</h1>

  <!-- ส่วนแสดงคะแนน -->
  <div id="score">0</div>
  
  <div id="cat-container">
    <img id="cat-img" src="close.png" alt="Pop NUEA Closed">
  </div>

  <audio id="pop-sound" src="pop.mp3" preload="auto"></audio>

  <script>
    const catImg = document.getElementById('cat-img');
    const scoreDisplay = document.getElementById('score');
    const popSound = document.getElementById('pop-sound');

    let count = parseInt(localStorage.getItem('popcat_score')) || 0;
    scoreDisplay.innerText = count;

    function pop() {
      count++;
      scoreDisplay.innerText = count;
      localStorage.setItem('popcat_score', count);

      catImg.src = 'open.png';

      if (popSound) {
        popSound.currentTime = 0;
        popSound.play().catch(() => {});
      }
    }

    function unpop() {
      catImg.src = 'close.png';
    }

    window.addEventListener('mousedown', pop);
    window.addEventListener('mouseup', unpop);

    window.addEventListener('keydown', (e) => {
      if (!e.repeat) pop();
    });
    window.addEventListener('keyup', unpop);

    window.addEventListener('touchstart', pop, { passive: true });
    window.addEventListener('touchend', unpop);
  </script>
</body>
</html>
